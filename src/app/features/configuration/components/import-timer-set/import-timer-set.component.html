<div class="import-container">
    <p-card>
        <ng-template #title>
            Import timer set
        </ng-template>
        
        <app-file-import (uploadedFile)="onTimerUploaded($event)"></app-file-import>
        @if (hasImportedTimers) {
            <div class="timers-details">
                <div class="field">
                    <label for="timerid">Id</label>
                    <input type="text" pInputText id="timerid" readonly [ngModel]="importedTimers.id" />
                </div>
                <div class="field">
                    <label for="timerdisplay">Display name</label>
                    <input type="text" pInputText id="timerdisplay" readonly [ngModel]="importedTimers.displayName" />
                </div>
                <div class="field">
                    <label for="timergroup">Group</label>
                    <input type="text" pInputText id="timergroup" readonly [ngModel]="importedTimers.group" />
                </div>
                <div class="field">
                    <label for="timercreated">Created</label>
                    <input type="datetime" pInputText id="timercreated" readonly [ngModel]="importedTimers.created" />
                </div>
                <div class="field">
                    <label for="timerupdated">Last updated</label>
                    <input type="datetime" pInputText id="timerupdated" readonly [ngModel]="importedTimers.updated" />
                </div>
            </div>
        }

        <ng-template #footer>
            <p-button [disabled]="!hasImportedTimers" (click)="importTimers()">
                <span pButtonLabel>
                    @if (overwritesTimers) {
                        Import and update timer set
                    } @else {
                        Import timer set
                    }
                </span>
            </p-button>
        </ng-template>
    </p-card>
