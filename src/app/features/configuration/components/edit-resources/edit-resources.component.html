<div class="edit-container">
    <p-card>
        <ng-template #title>
            Manage images
        </ng-template>
        <div class="flex flex-col gap-2 mt-2 mb-2">
            @for (image of imageService.getImages(); track image.id) {
                <div class="flex flex-row gap-2">
                    <img role="presentation" height="75" width="75" [ngStyle]="{'image-rendering': image.renderingMode}" [src]="imageService.getImageObjectUrl(image.id)" />
                    <span class="text-xl self-center">{{image.displayName}}</span>

                </div>
            }
        </div>
        <!--<div class="timers-list">
            @for (timerSelectionEntry of editTimersService.timerSelection(); track timerSelectionEntry) {
                <p-button [link]="true" severity="secondary" class="editTimerSelectionEntry" [routerLink]="timerSelectionEntry.id">
                    <div pButtonLabel>
                        <span class="displayName">{{timerSelectionEntry.displayName}}</span>
                        <span class="group"> ({{timerSelectionEntry.group}})</span>
                    </div>
                </p-button>
            }
        </div>-->
        <ng-template #footer>
            <p-button [link]="true" routerLink="images/new" label="Add new image" />
            <p-button [link]="true" routerLink="images/import" label="Import images" />
        </ng-template>
    </p-card>
    <p-card>
        <ng-template #title>
            Manage sounds
        </ng-template>
        <!--<div class="timers-list">
            @for (timerSelectionEntry of editTimersService.timerSelection(); track timerSelectionEntry) {
                <p-button [link]="true" severity="secondary" class="editTimerSelectionEntry" [routerLink]="timerSelectionEntry.id">
                    <div pButtonLabel>
                        <span class="displayName">{{timerSelectionEntry.displayName}}</span>
                        <span class="group"> ({{timerSelectionEntry.group}})</span>
                    </div>
                </p-button>
            }
        </div>-->
        <ng-template #footer>
            <p-button [link]="true" routerLink="sounds/new" label="Add new sound" />
            <p-button [link]="true" routerLink="sounds/import" label="Import soundss" />
        </ng-template>
    </p-card>
</div>
