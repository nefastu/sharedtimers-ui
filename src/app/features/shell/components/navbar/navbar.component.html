<p-toolbar class="app-navbar">
    <ng-template #start>
        <p-button class="ml-2" routerLink="/" icon="pi pi-stopwatch" text />
        <a routerLink="/"  class="p-button p-button-link">
            <span pButtonLabel class="text-xl">Shared timers</span>
        </a>
    </ng-template>

    <ng-template #end>
        <app-connection-info></app-connection-info>
        <app-toggle-light-dark-mode></app-toggle-light-dark-mode>
        <p-menu #topbarmenu [model]="menuItems" [popup]="true" />
        <p-button (click)="topbarmenu.toggle($event)" icon="pi pi-cog" text class="mr-2" />
    </ng-template>
</p-toolbar>
